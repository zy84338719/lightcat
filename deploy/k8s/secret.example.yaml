# ⚠️ 示例文件——真实密码不要写进 Git。推荐直接用命令创建（见 deploy/K8S.md 第 2 步）：
#
#   kubectl -n lightcat create secret generic lightcat-secret \
#     --from-literal=ACS_WEB_USER=admin \
#     --from-literal=ACS_WEB_PASS='你的强密码' \
#     --from-literal=ACS_API_TOKEN="$(openssl rand -hex 16)"
#
# 注意：面板账号只在**首次启动**（空数据库）时种一次，之后改密码走面板「设置」页；
# ConnectionRequest 密码不配则自动生成并存库（跨重启稳定），显式指定仅在换库迁移时需要。
apiVersion: v1
kind: Secret
metadata:
  name: lightcat-secret
  labels:
    app.kubernetes.io/name: lightcat
type: Opaque
stringData:
  ACS_WEB_USER: admin
  ACS_WEB_PASS: CHANGE-ME
  # ACS_API_TOKEN: ""
  # ACS_CONNREQ_PASS: ""
