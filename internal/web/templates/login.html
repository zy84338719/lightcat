<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2357aeff'/%3E%3Cstop offset='1' stop-color='%237c8fff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url%28%23g%29'/%3E%3Cline x1='21' y1='33' x2='15' y2='17' stroke='white' stroke-width='4.5' stroke-linecap='round'/%3E%3Cline x1='43' y1='33' x2='49' y2='17' stroke='white' stroke-width='4.5' stroke-linecap='round'/%3E%3Crect x='12' y='33' width='40' height='15' rx='5' fill='white'/%3E%3Ccircle cx='20' cy='40.5' r='2' fill='%233f6fe0'/%3E%3Ccircle cx='27' cy='40.5' r='2' fill='%233f6fe0'/%3E%3Crect x='33' y='38.8' width='13' height='3.4' rx='1.7' fill='%233f6fe0' opacity='.55'/%3E%3C/svg%3E">
<meta name="color-scheme" content="dark light">
<title>{{T "登录 · LightCat 光猫管家"}}</title>
<link rel="stylesheet" href="/static/style.css">
<script>
  // 在样式生效之前把主题定下来，避免刷新时先闪一下暗色
  (function () {
    try {
      var t = localStorage.getItem("theme");
      if (t !== "light" && t !== "dark") {
        t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches)
          ? "light" : "dark";
      }
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  })();
</script>
</head>
<body>
<main class="login-wrap">
  <form class="login-card" method="post" action="/login">
    <h1>{{T "LightCat 光猫管家"}}</h1>
    <div class="hint" style="margin-bottom:18px">{{T "请登录后使用面板"}}</div>

    <label for="user">{{T "账号"}}</label>
    <input id="user" name="user" type="text" value="{{.User}}" autocomplete="username"
           autofocus required>

    <label for="pass" style="margin-top:14px">{{T "密码"}}</label>
    <input id="pass" name="pass" type="password" autocomplete="current-password" required>

    <input type="hidden" name="next" value="{{.Next}}">

    {{if .Error}}<div class="notice login-error">{{.Error}}</div>{{end}}

    <button type="submit" style="width:100%;margin-top:20px">{{T "登录"}}</button>
    <div class="hint" style="margin-top:14px">
      {{T "账号密码在「设置」页里改；忘了的话，用"}} <span class="mono">ACS_WEB_AUTH=off</span> {{T "起一次就能进来。"}}
    </div>
  </form>
</main>
</body>
</html>
