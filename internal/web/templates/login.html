<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%234da3ff'/%3E%3Cpath d='M15 41a24 24 0 0 1 34 0' stroke='white' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3Cpath d='M22 48a14 14 0 0 1 20 0' stroke='white' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='54' r='3.5' fill='white'/%3E%3C/svg%3E">
<meta name="color-scheme" content="dark light">
<title>{{T "登录 · LightCat 光猫管家"}}</title>
<link rel="stylesheet" href="/static/style.css">
<script>
  // 在样式生效之前把主题定下来，避免刷新时先闪一下暗色
  (function () {
    try {
      var t = localStorage.getItem("theme");
      if (t !== "light" && t !== "dark") {
        t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches)
          ? "light" : "dark";
      }
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  })();
</script>
</head>
<body>
<main class="login-wrap">
  <form class="login-card" method="post" action="/login">
    <h1>{{T "LightCat 光猫管家"}}</h1>
    <div class="hint" style="margin-bottom:18px">{{T "请登录后使用面板"}}</div>

    <label for="user">{{T "账号"}}</label>
    <input id="user" name="user" type="text" value="{{.User}}" autocomplete="username"
           autofocus required>

    <label for="pass" style="margin-top:14px">{{T "密码"}}</label>
    <input id="pass" name="pass" type="password" autocomplete="current-password" required>

    <input type="hidden" name="next" value="{{.Next}}">

    {{if .Error}}<div class="notice login-error">{{.Error}}</div>{{end}}

    <button type="submit" style="width:100%;margin-top:20px">{{T "登录"}}</button>
    <div class="hint" style="margin-top:14px">
      {{T "账号密码在「设置」页里改；忘了的话，用"}} <span class="mono">ACS_WEB_AUTH=off</span> {{T "起一次就能进来。"}}
    </div>
  </form>
</main>
</body>
</html>
