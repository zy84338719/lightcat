<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%234da3ff'/%3E%3Cpath d='M15 41a24 24 0 0 1 34 0' stroke='white' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3Cpath d='M22 48a14 14 0 0 1 20 0' stroke='white' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='54' r='3.5' fill='white'/%3E%3C/svg%3E">
<meta name="color-scheme" content="dark light">
<title>{{T "页面不存在 · LightCat 光猫管家"}}</title>
<link rel="stylesheet" href="/static/style.css">
<script>
  // 在样式生效之前把主题定下来，避免刷新时先闪一下暗色
  (function () {
    try {
      var t = localStorage.getItem("theme");
      if (t !== "light" && t !== "dark") {
        t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches)
          ? "light" : "dark";
      }
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  })();
</script>
</head>
<body>
{{template "topnav" .}}
<main>
  <div class="empty" style="margin-top:48px">
    <div style="font-size:44px; font-weight:700; color:var(--line-strong); line-height:1.2">404</div>
    <div style="margin:10px 0 16px">{{T "没有找到这个页面——链接可能过期了，或页面已挪走。"}}</div>
    <a class="btn" href="/">{{T "回到设备列表"}}</a>
  </div>
</main>
<script>window.I18N = {{.I18NJSON}};</script>
<script src="/static/app.js"></script>
</body>
</html>
